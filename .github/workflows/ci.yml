name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Run by hand to get an installable APK aimed at a particular deployment: the
  # server address has to be baked in at build time, so it cannot be changed
  # afterwards without rebuilding.
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Server the app should talk to, e.g. https://rutiini.example.fi'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      # The suite covers authentication, authorisation, validation, query shaping
      # and translation completeness, and needs no database.
      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

  schema:
    name: Schema applies to a real PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rutiini
          POSTGRES_PASSWORD: rutiini
          POSTGRES_DB: rutiini
        options: >-
          --health-cmd "pg_isready -U rutiini"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://rutiini:rutiini@localhost:5432/rutiini

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Catches a schema change that typechecks but will not apply, and proves the
      # indexes the API depends on are actually created.
      - name: Apply schema
        run: npm run db:push -- --force

      - name: Verify indexes exist
        run: |
          count=$(psql "$DATABASE_URL" -tAc \
            "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname LIKE '%\_idx';")
          echo "Indexes created: $count"
          if [ "$count" -lt 60 ]; then
            echo "::error::Expected at least 60 performance indexes, found $count"
            exit 1
          fi

      # The seed is the demo path; a broken one gets found by a prospect, not by us.
      - name: Seed demo data
        run: npx tsx server/seed.ts

      - name: Build
        run: npm run build

      # Production refuses to start unconfigured. Prove that here rather than
      # discovering it on a deployment: this job previously failed because the
      # smoke test below started the production build without SMTP_HOST, which is
      # exactly what the guard exists to prevent.
      - name: Production refuses to start unconfigured
        env:
          NODE_ENV: production
          PORT: '5001'
        run: |
          set -uo pipefail

          # Refusing for some *other* reason would be a false pass, so the
          # expected variable name has to appear in the message.
          expect_refusal() {
            local label="$1"; shift
            local output status
            # timeout, because a regressed guard means the server *starts* and
            # listens forever; the job must fail fast, not hang until it is killed.
            output=$(timeout 30 env "$@" node dist/index.js 2>&1) && status=0 || status=$?
            if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
              echo "::error::server started without $label"
              exit 1
            fi
            if ! grep -q "$label must be set in production" <<<"$output"; then
              echo "::error::exited without naming $label:"
              echo "$output"
              exit 1
            fi
            echo "  $label -> refused as expected"
          }

          expect_refusal "JWT_SECRET" SMTP_HOST=localhost
          expect_refusal "SMTP_HOST" JWT_SECRET=ci-secret-long-enough-to-pass-the-production-check

      # Smoke test against the production build: the server must start, serve the
      # login screen's municipality list, and accept every seeded role. This is
      # what a prospect does in the first two minutes of a demo.
      - name: Smoke test the production build
        env:
          JWT_SECRET: ci-secret-long-enough-to-pass-the-production-check
          # Satisfies the production guard. Nothing in this smoke test sends mail,
          # so the host is never contacted.
          SMTP_HOST: localhost
          APP_URL: http://localhost:5000
          NODE_ENV: production
          PORT: '5000'
        run: |
          set -euo pipefail
          node dist/index.js &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 http://localhost:5000/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:5000/api/health

          municipalities=$(curl -fsS http://localhost:5000/api/public/municipalities)
          echo "Municipalities: $municipalities"
          case "$municipalities" in
            *Helsinki*) ;;
            *) echo "::error::Login screen would show no municipalities"; exit 1 ;;
          esac

          sign_in() {
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST "http://localhost:5000/api/auth/login/$1" \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$2\",\"password\":\"password123\",\"daycareCode\":\"aurinko\"}")
            echo "  $1 -> HTTP $code"
            [ "$code" = "200" ] || { echo "::error::$1 could not sign in"; exit 1; }
          }
          sign_in daycareleader admin@aurinko.fi
          sign_in staff maria@aurinko.fi
          sign_in guardian anna@example.fi

  android:
    name: Android app compiles and packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Capacitor's Android project targets Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # Two-phase by necessity: the web assets are build output and are not in
      # version control, so a fresh clone has none and Gradle would package an app
      # whose webview has nothing to load. The address is required rather than
      # assumed, because a native build has no server to fall back on -- see
      # scripts/build-mobile.mjs. The default here only has to be a valid https
      # address for the bundle to compile against; supply a real one through the
      # MOBILE_API_URL variable, or when running the workflow by hand, to get an
      # APK that can actually talk to a deployment.
      - name: Build the web bundle and sync it into the native projects
        env:
          VITE_API_URL: ${{ inputs.api_url || vars.MOBILE_API_URL || 'https://rutiini.example.fi' }}
        run: npm run build:mobile

      - name: Confirm the assets really landed in the Android project
        run: |
          test -f android/app/src/main/assets/public/index.html \
            || { echo "::error::cap sync did not produce the web assets"; exit 1; }
          echo "Assets present: $(du -sh android/app/src/main/assets/public | cut -f1)"

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # The release bundle is what actually goes to Google Play, and it is not
      # the same build as the debug APK: it runs the proguard configuration and
      # the release manifest merge, either of which can fail on their own. Left
      # unchecked, the first time anyone found out would be on the evening they
      # sat down to publish.
      #
      # Unsigned here on purpose. app/build.gradle attaches the signing config
      # only when keystore.properties exists, and that file holds the key that
      # identifies the app on Play -- it belongs on the maintainer's machine,
      # not in CI. Unsigned still proves the build itself is sound; signing is
      # the last step and is done locally by build-android.bat.
      - name: Build the release bundle, unsigned
        run: ./gradlew bundleRelease --no-daemon
        working-directory: android

      - name: Report what the release bundle came to
        run: |
          aab=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -n "$aab" || { echo "::error::bundleRelease produced no .aab"; exit 1; }
          echo "Release bundle: $aab ($(du -h "$aab" | cut -f1))"
          echo "Unsigned -- Google Play will not accept this file. Build it"
          echo "locally with build-android.bat to get a signed one."

      # The thing a person can actually install, kept from every build so a
      # regression in the native packaging is visible rather than theoretical.
      - uses: actions/upload-artifact@v4
        with:
          name: rutiini-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
